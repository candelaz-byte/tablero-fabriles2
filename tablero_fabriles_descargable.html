<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#ffffff;color:#1a1a1a;padding:24px}

.header{padding:0 0 1rem}
.header-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.header h1{font-size:20px;font-weight:500}
.updated{font-size:11px;color:#888;background:#f2f2f2;padding:3px 10px;border-radius:20px}
.header-sub{font-size:12px;color:#888}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:1.5rem}
.kpi{background:#f5f5f5;border-radius:8px;padding:12px 14px}
.kpi-label{font-size:11px;color:#888;margin-bottom:5px;line-height:1.3}
.kpi-val{font-size:20px;font-weight:500;line-height:1}
.kpi-sub{font-size:10px;color:#888;margin-top:4px}
.kpi-val.neg{color:#A32D2D}
.kpi-val.pos{color:#3B6D11}

.nav{display:flex;gap:0;border-bottom:1px solid #e5e5e5;margin-bottom:1.25rem}
.nav-btn{padding:8px 16px;font-size:12px;font-weight:500;border:none;background:transparent;color:#888;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:Arial,sans-serif;transition:color .15s}
.nav-btn.on{color:#1a1a1a;border-bottom-color:#1a1a1a}
.panel{display:none}.panel.on{display:block}

.tw{overflow-x:auto;border:0.5px solid #e5e5e5;border-radius:12px;margin-bottom:1.5rem}
table{width:100%;border-collapse:collapse;min-width:680px}

thead tr{border-bottom:1px solid #e5e5e5}
th{padding:9px 12px;font-size:10px;font-weight:500;color:#888;text-align:right;white-space:nowrap;background:#f9f9f9}
th:first-child{text-align:left;border-radius:12px 0 0 0}
th:last-child{border-radius:0 12px 0 0}
th.hl{background:#E6F1FB;color:#0C447C}
th.yr26{background:#EBF3FF;color:#185FA5;font-weight:700;border-top:3px solid #185FA5}
td.yr26{background:#F5F9FF}
td.yr26.neg{background:#F5F9FF;color:#A32D2D}
td.yr26.pos{background:#F5F9FF;color:#3B6D11}
tr.total-row td.yr26{background:#dceeff}
tr.group-hdr td.yr26{background:#EBF3FF}

tr.group-hdr td{background:#f5f5f5;border-top:1px solid #e5e5e5;padding:6px 12px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#888}
tr.group-hdr td:first-child{color:#1a1a1a;font-size:11px}

td{padding:6px 12px;font-size:11px;text-align:right;border-bottom:0.5px solid #e5e5e5;color:#1a1a1a;white-space:nowrap}
td:first-child{text-align:left}
tr:last-child td{border-bottom:none}

td.neg{color:#A32D2D}
td.pos{color:#3B6D11}
td.hl{background:#E6F1FB;color:#0C447C;font-weight:500}
td.hl.neg{background:#FCEBEB;color:#A32D2D;font-weight:500}
td.hl.pos{background:#EAF3DE;color:#3B6D11;font-weight:500}
td.row-label{font-weight:400;color:#888;text-align:left;padding-left:20px}
td.row-label.indent{padding-left:12px}
td.std-val{color:#185FA5;font-weight:500}
tr.total-row td{background:#f5f5f5;font-weight:500;border-top:1px solid #e5e5e5}
tr.total-row td.row-label{color:#1a1a1a;padding-left:12px}

.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.pill.neg{background:#FCEBEB;color:#A32D2D}
.pill.pos{background:#EAF3DE;color:#3B6D11}
</style>

// ─── Formatters ───────────────────────────────────────────────────────────────
function fV(v){ if(v===null||v===undefined) return '<span style="color:#aaa">—</span>'; return v.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fG(v){ if(v===null||v===undefined) return '<span style="color:#aaa">—</span>'; return (v/1e6).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'M'; }
function fP(v){ if(v===null||v===undefined) return '<span style="color:#aaa">—</span>'; return '$'+Math.round(v).toLocaleString('es-AR'); }
function fPct(v){ if(v===null) return '—'; const c=v<0?'pos':'neg'; return `<span class="pill ${c}">${v>0?'+':''}${(v*100).toFixed(1)}%</span>`; }
function fmt(v,f){ return f==='vol'?fV(v):f==='gas'?fG(v):fP(v); }
function nc(v,f){ if(v===null||v===undefined) return ''; return (f==='ptn'||f==='gas')?(v<0?'neg':'pos'):''; }
function acumHl(v,f){ return 'hl'+((v!==null&&v!==undefined)?(v<0?' neg':' pos'):''); }

// ─── Render ───────────────────────────────────────────────────────────────────
function buildTable(tid, data){
  const t = document.getElementById(tid);
  let h = `<thead><tr><th>Sector</th><th>Indicador</th>`;
  M.forEach(m=>{ h+=`<th class="${m.endsWith('-26')?'yr26':''}">${m}</th>`; });
  h += `<th class="hl">Acumulado</th></tr></thead><tbody>`;
  data.forEach(sec=>{
    h += `<tr class="group-hdr"><td>${sec.g}</td><td colspan="${M.length+1}"></td></tr>`;
    sec.rows.forEach(row=>{
      h += `<tr class="${sec.tot?'total-row':''}">`;
      h += `<td></td><td class="row-label${sec.tot?' indent':''}">${row.l}</td>`;

      });
      h += `<td class="${acumHl(row.a,row.fmt)}">${row.a!==null?fmt(row.a,row.fmt):'—'}</td></tr>`;

        h += `<tr class="${sec.tot?'total-row':''}">`;
        h += `<td></td><td class="row-label${sec.tot?' indent':''}" style="color:#888;font-style:italic">USD/tn</td>`;

          const y26 = M[i]&&M[i].endsWith('-26') ? ' yr26' : '';
          const usd = v!=null ? Math.round(v/TC) : null;
          h+=`<td class="${nc(v,'ptn')}${y26}" style="font-style:italic">${usd!=null?'USD'+Math.abs(usd).toLocaleString('es-AR'):'<span style="color:#aaa">—</span>'}</td>`;
        });
        const ua = row.a!=null ? Math.round(row.a/TC) : null;
        h += `<td class="${acumHl(row.a,'ptn')}" style="font-style:italic">${ua!=null?'USD'+Math.abs(ua).toLocaleString('es-AR'):'—'}</td></tr>`;
      }
    });
  });
  t.innerHTML = h + '</tbody>';
}

const TC = 1450;
function fUSD(v){ if(!v) return '—'; return 'USD'+Math.round(v/TC).toLocaleString('es-AR'); }

function fVar(real, std){
  if(!real||!std) return '—';
  const pct = (real - std) / std * 100;
  const cls = pct < 0 ? 'pos' : 'neg';
  return `<span class="pill ${cls}">${pct>0?'+':''}${pct.toFixed(1)}%</span>`;
}

function buildCos(cosData, ultLabel, trimLabel, anualLabel){
  ultLabel   = ultLabel   || 'últ. mes';
  trimLabel  = trimLabel  || 'trimestre';
  anualLabel = anualLabel || 'acumulado';
  const t = document.getElementById('tcos');
  const sub = s => `<br><span style="font-weight:400;font-size:0.95em;color:#888;white-space:nowrap">${s}</span>`;
  let h = `<thead><tr>
    <th>Sector</th>
    <th>$/tn${sub(ultLabel)}</th><th>USD/tn${sub(ultLabel)}</th>
    <th>$/tn${sub(trimLabel)}</th><th>USD/tn${sub(trimLabel)}</th>
    <th class="hl">$/tn${sub(anualLabel)}</th><th class="hl">USD/tn${sub(anualLabel)}</th>
    <th>Costo std</th>
    <th>vs std${sub(ultLabel)}</th><th>vs std${sub(trimLabel)}</th><th class="hl">vs std${sub(anualLabel)}</th>
  </tr></thead><tbody>`;
  cosData.forEach((c,i)=>{
    const isComb = !!c.combined;
    const fw = isComb ? 'font-weight:600;' : '';
    const bg = isComb ? 'background:#f0f4fa;' : (i%2===0?'background:#f9f9f9;':'');
    h += `<tr style="${bg}${fw}">`;
    h += `<td class="row-label indent">${c.n}</td>`;
    h += `<td class="neg">${c.ult?'$'+Math.round(c.ult).toLocaleString('es-AR'):'—'}</td>`;
    h += `<td class="neg">${fUSD(c.ult)}</td>`;
    h += `<td class="neg">${c.trim?'$'+Math.round(c.trim).toLocaleString('es-AR'):'—'}</td>`;
    h += `<td class="neg">${fUSD(c.trim)}</td>`;
    h += `<td class="hl neg">${c.anual?'$'+Math.round(c.anual).toLocaleString('es-AR'):'—'}</td>`;
    h += `<td class="hl neg">${fUSD(c.anual)}</td>`;
    h += `<td class="std-val">${c.std?'$'+Math.round(c.std).toLocaleString('es-AR'):'—'}</td>`;
    h += `<td>${fVar(c.ult,c.std)}</td>`;
    h += `<td>${fVar(c.trim,c.std)}</td>`;
    h += `<td class="hl">${fVar(c.anual,c.std)}</td>`;
    h += `</tr>`;
  });
  t.innerHTML = h + '</tbody>';
}

function sp(id,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('p'+id).classList.add('on');
  el.classList.add('on');
}

// ─── KPIs dinámicos ───────────────────────────────────────────────────────────
function updateKPIs(data) {
  // Gasto total
  const gt = data.gastoTotal;
  document.getElementById('kpi-gasto').textContent =
    (gt < 0 ? '-' : '') + '$' + (Math.abs(gt)/1e6).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0}) + 'M';

  // Top 4 rubros del COS ordenados por impacto (mayor gasto anual absoluto)
  const sorted = [...data.COS].sort((a,b) => (b.anual||0) - (a.anual||0));
  const top4   = sorted.slice(0, 4);
  const ult    = data.cosUltLabel || data.meses[data.meses.length - 1] || '';

  top4.forEach((c, i) => {
    const n = i + 1;
    document.getElementById(`kpi${n}-lbl`).textContent = `$/tn ${c.n} — ${ult}`;
    document.getElementById(`kpi${n}-val`).textContent = c.ult ? `-$${Math.round(c.ult).toLocaleString('es-AR')}` : '—';
    document.getElementById(`kpi${n}-sub`).textContent = c.anual ? `acum $${Math.round(c.anual).toLocaleString('es-AR')}/tn` : '';
  });
}
